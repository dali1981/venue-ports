[package]
name = "venue-ports"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A tested, reusable connection layer between an automated trading system and the DEX/CEX venues it trades on."
repository = "https://github.com/dali1981/venue-ports"

[dependencies]
alloy-consensus = "2.5.0"
alloy-primitives = { version = "1.7.3", features = ["std", "k256"] }
alloy-sol-types = { version = "1.7.3", features = ["std"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
hex = "0.4.3"
hmac = "0.12.1"
# Pinned to the exact version `alloy-primitives`'s own `k256` feature pulls
# in (its `Signature: From<(k256::ecdsa::Signature, RecoveryId)>` impl is
# only defined against that version's types) — letting this float to 0.14
# would give two incompatible `k256` versions in the graph.
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
# The Solana SDK: one version line, the one `solana-sdk` 5.0 pins
# (`IMPLEMENTATION_PLAN.md` Phase 15, step 1). Never `solana-rpc-client`.
solana-address = { version = "=2.8.0", features = ["curve25519", "decode"] }
solana-hash = "=4.7.0"
solana-instruction = "=4.0.0"
solana-keypair = "=4.0.0"
solana-message = "=5.1.0"
solana-signature = "=3.6.0"
solana-signer = "=4.0.0"
solana-transaction = { version = "=5.1.0", features = ["serde", "verify"] }
# A Solana transaction's wire encoding (serde, through solana-transaction's
# own short-vec layout).
bincode = "1.3.3"
base64 = "0.22.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "macros", "sync"] }

[dev-dependencies]
# Already in the graph through `alloy-consensus`; the tests use it to decode
# the raw transactions a mock node receives.
alloy-eips = "2.5.0"
wiremock = "0.6.5"

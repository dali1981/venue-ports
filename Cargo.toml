[package]
name = "venue-ports"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A tested, reusable connection layer between an automated trading system and the DEX/CEX venues it trades on."
repository = "https://github.com/dali1981/venue-ports"

[dependencies]
alloy-primitives = { version = "1.7.3", features = ["std"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
hex = "0.4.3"
hmac = "0.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "macros"] }

[dev-dependencies]
wiremock = "0.6.5"
